# One small Prometheus for OpenCost (chart prometheus-community/prometheus 29.37.0).
# Install: helm upgrade --install prometheus prometheus-community/prometheus --version 29.37.0 \
#   -n prometheus-system --create-namespace -f prometheus-values.yaml -f extraScrapeConfigs.yaml
# Departures from OpenCost's example (see demo/README.md for the trade-offs):
#   - node-exporter off: it is a DaemonSet that would need a toleration for every scaler=* taint.
#     Pod allocation still works (cAdvisor + kube-state-metrics). To verify at rehearsal.
#   - no persistent volume: no EBS CSI needed; history is lost when the pod restarts.
#   - everything on role=system nodes, single replica, no HA.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: true
  nodeSelector:
    role: system
server:
  retention: 24h
  persistentVolume:
    enabled: false
  nodeSelector:
    role: system
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
