# Derived from boutique-eks-argocd@446ed56 deploy/helm/boutique/values.yaml; modified for finops-spot-demo
# Base values. values-common.yaml overrides registry/tag/replicas; values-<scaler>.yaml sets only
# namespace + scheduling.scaler. Dropped from the source: tracing env, redis, externalSecrets,
# networkPolicy, ECR registry, autoscaling (HPA would change replicas between scalers).
nameOverride: boutique
namespace: boutique

image:
  registry: ""
  repositoryPrefix: ""
  tag: "latest"

# Tracing is off in this demo.
commonEnv: []

scheduling:
  # Required. One of: ca | karpenter | automode (set by values-<scaler>.yaml).
  scaler: ""

pdb:
  minAvailable: 1

defaultResources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

services:
  frontend:
    enabled: true
    port: 8080
    serviceType: ClusterIP
    replicas: 1
    env:
      - name: PORT
        value: "8080"
      - name: ENABLE_ASSISTANT
        value: "false"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalogservice:3550"
      - name: CURRENCY_SERVICE_ADDR
        value: "currencyservice:7000"
      - name: CART_SERVICE_ADDR
        value: "cartservice:7070"
      - name: RECOMMENDATION_SERVICE_ADDR
        value: "recommendationservice:8080"
      - name: CHECKOUT_SERVICE_ADDR
        value: "checkoutservice:5050"
      - name: SHIPPING_SERVICE_ADDR
        value: "shippingservice:50051"
      - name: AD_SERVICE_ADDR
        value: "adservice:9555"
      - name: SHOPPING_ASSISTANT_SERVICE_ADDR
        value: "shoppingassistantservice:8080"
  productcatalogservice:
    enabled: true
    port: 3550
    replicas: 1
    env:
      - name: PORT
        value: "3550"
  currencyservice:
    enabled: true
    port: 7000
    replicas: 1
    env:
      - name: PORT
        value: "7000"
      - name: DISABLE_PROFILER
        value: "1"
  cartservice:
    # No REDIS_ADDR on purpose: cartservice falls back to its in-memory cart store, so carts are per pod
    # and lost when the pod moves (teaching point). Hence 1 replica and no PDB.
    enabled: true
    port: 7070
    replicas: 1
    env:
      - name: ASPNETCORE_HTTP_PORTS
        value: "7070"
  recommendationservice:
    enabled: true
    port: 8080
    replicas: 1
    env:
      - name: PORT
        value: "8080"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalogservice:3550"
  checkoutservice:
    enabled: true
    port: 5050
    replicas: 1
    env:
      - name: PORT
        value: "5050"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalogservice:3550"
      - name: SHIPPING_SERVICE_ADDR
        value: "shippingservice:50051"
      - name: PAYMENT_SERVICE_ADDR
        value: "paymentservice:50051"
      - name: EMAIL_SERVICE_ADDR
        value: "emailservice:8080"
      - name: CURRENCY_SERVICE_ADDR
        value: "currencyservice:7000"
      - name: CART_SERVICE_ADDR
        value: "cartservice:7070"
  paymentservice:
    enabled: true
    port: 50051
    replicas: 1
    env:
      - name: PORT
        value: "50051"
      - name: DISABLE_PROFILER
        value: "1"
  shippingservice:
    enabled: true
    port: 50051
    replicas: 1
    env:
      - name: PORT
        value: "50051"
  emailservice:
    enabled: true
    port: 8080
    replicas: 1
    env:
      - name: PORT
        value: "8080"
  adservice:
    enabled: true
    port: 9555
    replicas: 1
    env:
      - name: PORT
        value: "9555"
  shoppingassistantservice:
    enabled: false
    port: 8080
    replicas: 1
    env:
      - name: PORT
        value: "8080"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalogservice:3550"
