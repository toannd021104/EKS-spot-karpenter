{{/* Derived from boutique-eks-argocd@446ed56 deploy/helm/boutique/templates/service.yaml; modified for finops-spot-demo (labels, default ClusterIP) */}}
{{- range $svcName, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ include "boutique.namespace" $ }}
  labels:
    app.kubernetes.io/name: {{ $svcName }}
    scaler: {{ include "boutique.scaler" $ }}
spec:
  type: {{ default "ClusterIP" $svc.serviceType }}
  selector:
    app.kubernetes.io/name: {{ $svcName }}
  ports:
    - name: tcp
      port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      protocol: TCP
---
{{ end }}
{{- end }}
